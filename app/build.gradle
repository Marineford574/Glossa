plugins {
    id 'com.android.application'
}

android {
    namespace 'com.batchmine.pocket'
    compileSdk 34

    defaultConfig {
        applicationId 'com.batchmine.pocket'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // A fixed key for the "debug" build, kept in the project, so every build is signed the same way and a new version
    // installs over the old one (your words, books and dictionaries stay).
    signingConfigs {
        pocket {
            storeFile file('pocket.keystore')
            storePassword 'pocketpocket'
            keyAlias 'pocket'
            keyPassword 'pocketpocket'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.pocket
        }
        debug {
            signingConfig signingConfigs.pocket
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
