name: Build the app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle --no-daemon assembleRelease
      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk GlossaPocket.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GlossaPocket
          path: GlossaPocket.apk
      - name: Make a release with the file
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Glossa Pocket (latest)
          files: GlossaPocket.apk
        continue-on-error: true
